<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Les Cartes de Mamou</title>
  <meta name="description" content="French flashcards with Monsieur Croissant: spaced repetition, games, trophies and a Tour de France.">
  <meta name="theme-color" content="#B8232F">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mamou">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="awning"></div>
    <h1 class="logo">Les Cartes <span class="de">de</span> <span class="mamou">Mamou</span></h1>
    <p class="tagline">Chargement… (loading)</p>
  </main>
  <div id="toasts" aria-live="assertive"></div>
  <div id="modal-root"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <noscript><p style="text-align:center;padding:2rem">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/main.js"></script>
  <script>
    // If the app hasn't started after a while (bad connection, stale files), offer a reload.
    setTimeout(function () {
      if (window.__mamouStarted) return;
      var t = document.querySelector('.tagline');
      if (t) t.innerHTML = 'Hmm, ça charge lentement… <button class="btn small" onclick="location.reload()">Recharger (reload)</button>';
    }, 7000);
  </script>
</body>
</html>
